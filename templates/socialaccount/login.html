{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% trans "Sign In Via Third-Party" %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/custom-auth.css' %}">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-sm rounded p-4 text-center">
        <h1>{% trans "Sign In Via Third-Party" %}</h1>
        <p>{% trans "You are about to sign in using a third-party account." %}</p>

        <form method="post" action="">
          {% csrf_token %}
          <button type="submit" class="btn btn-primary btn-lg mt-3">
            {% trans "Continue" %}
          </button>
        </form>

        <div class="mt-4">
          <a href="{% url 'account_login' %}">{% trans "Cancel and return to login" %}</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
