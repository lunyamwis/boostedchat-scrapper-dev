{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% trans "Password Reset Sent" %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/custom-auth.css' %}">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-sm rounded">
        <div class="card-body p-4 text-center">

          <h2 class="mb-4">{% trans "Check your email" %}</h2>

          <p>
            {% trans "We have sent you an email with instructions to reset your password." %}
          </p>

          <a href="{% url 'account_login' %}" class="btn btn-primary mt-3">{% trans "Back to Login" %}</a>
          
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
