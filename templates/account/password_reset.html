{% load i18n %}
{% load widget_tweaks %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% trans "Reset Your Password" %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/custom-auth.css' %}">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="card shadow-sm rounded">
        <div class="card-body p-4">

          <h2 class="mb-4 text-center">{% trans "Reset Your Password" %}</h2>

          <form method="POST" action="{% url 'account_reset_password' %}">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="mb-3">
              <label for="id_email" class="form-label">{% trans "Email Address" %}</label>
              {{ form.email|add_class:"form-control" }}
              {{ form.email.errors }}
            </div>

            <button type="submit" class="btn btn-primary w-100">{% trans "Send Reset Link" %}</button>
          </form>

          <div class="text-center mt-4">
            <p><a href="{% url 'account_login' %}">{% trans "Return to login" %}</a></p>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
