<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Out</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Lunyamwi</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/accounts/email/">Change Email</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/accounts/logout/">Sign Out</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="card shadow-sm mx-auto" style="max-width: 400px;">
      <div class="card-body text-center">
        <h1 class="card-title mb-4">Sign Out</h1>
        <p class="mb-4 fs-5">Are you sure you want to sign out?</p>
        <form method="post" action="/accounts/logout/">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-5">Sign Out</button>
          <a href="/" class="btn btn-secondary ms-3">Cancel</a>
        </form>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle CDN (for navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
