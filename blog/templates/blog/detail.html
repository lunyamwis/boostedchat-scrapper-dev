{% extends "blog/base.html" %}
{% load static %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <!-- Post Thumbnail -->
        <div class="mb-4">
          <img src="{{ post.thumbnail.url }}" alt="{{ post.title }}" class="img-fluid rounded shadow-sm w-100">
        </div>

        <!-- Post Content -->
        <article>
          <h1 class="fw-bold mb-3">{{ post.title }}</h1>
          <small class="text-muted d-block mb-4">{{ post.created_at|date:"F d, Y" }}</small>
          <div class="fs-5 lh-lg">
            {{ post.content|safe }}
          </div>
        </article>

        <!-- Back Link -->
        <div class="mt-5">
          <a href="{% url 'blog_list' %}" class="btn btn-outline-secondary">← Back to Blog</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
