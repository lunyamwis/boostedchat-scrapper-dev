{% extends 'analyst/index.html' %}
{% load crispy_forms_tags %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<!-- dashboard.html -->
<form method="post">
    {% csrf_token %}
    {{ form | crispy }}  <!-- Render the form -->
    <button type="submit">Submit</button>
</form>
<!-- Include Bokeh CSS -->
<link href="https://cdn.bokeh.org/bokeh/release/bokeh-3.6.1.min.css" rel="stylesheet" type="text/css">

<h1 class="mb-4">Dashboard</h1>

<div class="row">
    <!-- Matplotlib Chart -->
    <div class="col-md-6 text-center">
        <h2>Chart</h2>
        <img src="data:image/png;base64,{{ chart_mpl }}" alt="Matplotlib Chart" class="img-fluid rounded">
    </div>
    <!-- Bokeh Chart -->
    <div class="col-md-6 text-center">
        <h2>Interactive Chart</h2>
        {{ chart_bokeh_div|safe }}  <!-- Render Bokeh plot -->
    </div>
</div>

<!-- Include Bokeh JS -->
<script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.6.1.min.js"></script>
<!-- Include Bokeh Script -->
{{ chart_bokeh_script|safe }} <!-- Render Bokeh script -->
{% endblock %}
