<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>workflows</h1>
    <a href="{% url 'create_workflow'%}">
        <p>+Add workflow</p>
    </a>
    <table>
        <tr>
            <th>id</th>
            <th>name</th>
            <th>description</th>
            <th>created_at</th>
            <th>updated_at</th>
            <th>actions</th>
        </tr>
        {% for workflow in workflows %}
        <tr>
            <td>{{ workflow.id }}</td>
            <td>{{ workflow.name }}</td>
            <td>{{ workflow.description }}</td>
            <td>{{ workflow.created_at }}</td>
            <td>{{ workflow.updated_at }}</td>
            
        </tr>
        {% endfor %}
    </table>
</body>
</html>
