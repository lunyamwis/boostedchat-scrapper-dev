{% extends "workflows/main.html" %}
{% block content %}
<h1>Http Operator Connections</h1>

{% if messages %}   
<div class="container mt-3">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
</div>

{% endif %}

<a href="{% url 'list_workflows' %}">back to workflows</a>
{{dag.dag_id}}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}  <!-- Renders the form fields -->
    <button type="submit" class="btn btn-primary">Run Workflow</button>
</form>
{% endblock %}
