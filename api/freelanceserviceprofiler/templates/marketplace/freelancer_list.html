{% extends 'workflows/main.html' %}
<div class="container mt-5">
  <h2>Freelancers</h2>
  <div class="row">
    {% for freelancer in freelancers %}
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">{{ freelancer.user.username }}</h5>
            <p class="card-text">{{ freelancer.bio|truncatewords:20 }}</p>
            <p class="card-text"><strong>Hourly Rate:</strong> ₦{{ freelancer.hourly_rate }}</p>
            <a href="{% url 'profile_detail' freelancer.id %}" class="btn btn-primary btn-sm">View Profile</a>
            <a href="{% url 'paystack_payment' freelancer.id %}" class="btn btn-success btn-sm">Hire & Pay</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
